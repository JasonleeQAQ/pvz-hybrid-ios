name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'ZIP download URL'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ZIP from provided URL
        run: |
          curl -L -o source.zip "${{ github.event.inputs.source_url }}"
          ls -la source.zip
          file source.zip

      - name: Unzip project
        run: |
          unzip -q source.zip -d extracted
          ls extracted/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install GDRE
        run: |
          GDRE_VERSION="2.6.3"
          GDRE_URL="https://github.com/GDRETools/gdsdecomp/releases/download/v${GDRE_VERSION}/gdsdecomp-${GDRE_VERSION}-standalone.jar"
          curl -L -o $HOME/gdre.jar "$GDRE_URL"
          echo "GDRE installed: $HOME/gdre.jar"
          ls -la $HOME/gdre.jar

      - name: Find and recover PCK
        id: recover
        run: |
          PCK=$(find extracted -name "*.pck" | head -1)
          if [ -z "$PCK" ]; then
            echo "ERROR: No PCK file found"
            exit 1
          fi
          echo "Found PCK: $PCK"
          echo "pck=$PCK" >> $GITHUB_OUTPUT
          mkdir -p recovered
          java -jar $HOME/gdre.jar --recover "$PCK" --output recovered/ 2>&1 | tail -20
          if [ -f recovered/project.godot ]; then
            echo "Godot project recovered successfully"
          fi
          ls recovered/ | head -20

      - name: Fix export_presets.cfg for iPad fullscreen
        run: |
          PRESETS="recovered/export_presets.cfg"
          mkdir -p recovered
          cat > "$PRESETS" << 'EOF'
[preset.0]
name="iOS"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../PlantsVsZombiesHybrid.xcodeproj"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
application/app_store_team_id=""
application/provisioning_profile_uuid_debug=""
application/provisioning_profile_uuid_release=""
application/name="PlantsVsZombies Hybrid"
application/info="Made with Godot Engine"
application/signature=""
application/version="0.25.5.0"
application/bundle_identifier="com.plantsvszombies.hybrid"
application/categories=PackedStringArray()
application/short_version="0.25.5"
application/min_ios_version="16.0"
application/orientation/portrait=false
application/orientation/landscape_left=true
application/orientation/landscape_right=true
application/orientation/portrait_upside_down=false
application/interruption_policy="stop"
application/supports_opengl=false
application/supports_metal=true
application/supports_open_gles2=false
application/supports_open_gles3=true
application/supports_vulkan=false
application/icon="res://icon.png"
application/additional_plist_content=""
capabilities/access_wifi=false
capabilities/push_notifications=false
capabilities/performance_gaming=false
capabilities/performance_a12=false
user_data/accessible_files_directories=PackedStringArray()
architecture/target="arm64"
application/export_method_debug=0
application/export_method_release=0
application/code_sign_identity_debug=""
application/code_sign_identity_release=""
EOF
          echo "export_presets.cfg created"

      - name: Fix project.godot fullscreen config
        run: |
          PROJECT="recovered/project.godot"
          if [ -f "$PROJECT" ]; then
            if ! grep -q "display/window/stretch/mode" "$PROJECT"; then
              echo "" >> "$PROJECT"
              echo "[display]" >> "$PROJECT"
              echo "window/stretch/mode=\"viewport\"" >> "$PROJECT"
              echo "window/stretch/aspect=\"expand\"" >> "$PROJECT"
            fi
            echo "project.godot updated"
          fi

      - name: Install Godot 4.7.1 .NET
        run: |
          GODOT_VERSION="4.7.1"
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          curl -L -o /tmp/godot.zip "$GODOT_URL"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_mono.app $HOME/Godot.app
          echo "$HOME/Godot.app/Contents/MacOS" >> $GITHUB_PATH
          godot --version

      - name: Install Godot iOS export templates
        run: |
          TEMPLATES_VERSION="4.7.1"
          TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/${TEMPLATES_VERSION}-stable/Godot_v${TEMPLATES_VERSION}-stable_mono_ios.universal.zip"
          curl -L -o /tmp/templates.zip "$TEMPLATES_URL"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q /tmp/templates.zip -d "$TEMPLATES_DIR"
          echo "Templates installed"
          ls "$TEMPLATES_DIR"

      - name: Export Xcode project
        run: |
          cd recovered
          godot --headless --export-release "iOS" ../PlantsVsZombiesHybrid.xcodeproj 2>&1 | tail -30
          ls -la ../PlantsVsZombiesHybrid.xcodeproj/

      - name: Build unsigned IPA
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          xcodebuild -project PlantsVsZombiesHybrid.xcodeproj -scheme "PlantsVsZombies Hybrid" -configuration Release -destination 'generic/platform=iOS' -archivePath ../build/PlantsVsZombiesHybrid.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30
          cd ..
          mkdir -p build/ipa
          cat > build/export-options.plist << 'PLISTEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>development</string>
  <key>teamID</key>
  <string></string>
  <key>uploadBitcode</key>
  <false/>
  <key>compileBitcode</key>
  <false/>
</dict>
</plist>
PLISTEOF
          xcodebuild -exportArchive -archivePath build/PlantsVsZombiesHybrid.xcarchive -exportPath build/ipa -exportOptionsPlist build/export-options.plist CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          IPA=$(find build/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA found"
            exit 1
          fi
          echo "IPA: $IPA"
          ls -la "$IPA"
          cp "$IPA" pvz-hybrid-0.25.5.ipa

      - name: Upload IPA to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.25.5 pvz-hybrid-0.25.5.ipa --clobber
          echo "IPA uploaded to release v0.25.5"

      - name: Upload IPA artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: pvz-hybrid-ipa
          path: pvz-hybrid-0.25.5.ipa
