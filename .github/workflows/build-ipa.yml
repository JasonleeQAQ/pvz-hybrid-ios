name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'ZIP download URL'
        required: true
        type: string
      app_name:
        description: 'Application name'
        required: false
        default: 'PlantsVsZombies Hybrid'
        type: string
      bundle_id:
        description: 'Bundle identifier'
        required: false
        default: 'com.plantsvszombies.hybrid'
        type: string
      version:
        description: 'Version number'
        required: false
        default: '0.25.5'
        type: string

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ZIP
        run: |
          echo "URL: ${{ github.event.inputs.source_url }}"
          curl -L -v -o source.zip '${{ github.event.inputs.source_url }}' 2>&1 | tail -20
          ls -la source.zip

      - name: Install 7-Zip (Deflate64 support)
        run: |
          brew install p7zip

      - name: Unzip project
        run: |
          7z x source.zip -oextracted -y
          ls extracted/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install GDRE
        run: |
          curl -L -o gdre.jar "https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.3/gdsdecomp-2.6.3-standalone.jar"
          echo "GDRE installed"

      - name: Find and recover PCK
        id: recover
        run: |
          PCK=$(find extracted -name "*.pck" | head -1)
          if [ -z "$PCK" ]; then
            echo "ERROR: No PCK file found"
            exit 1
          fi
          echo "Found PCK: $PCK"
          mkdir -p recovered
          java -jar gdre.jar --recover "$PCK" --output recovered/ 2>&1 | tail -20
          ls recovered/ | head -10

      - name: Generate export_presets.cfg
        run: |
          cat > generate_presets.py << 'GENEOF'
          import sys
          app_name = sys.argv[1]
          bundle_id = sys.argv[2]
          version = sys.argv[3]
          short_version = version

          lines = [
              "[preset.0]",
              'name="iOS"',
              'platform="iOS"',
              "runnable=true",
              "advanced_options=false",
              "dedicated_server=false",
              'custom_features=""',
              'export_filter="all_resources"',
              'include_filter=""',
              'exclude_filter=""',
              'export_path="../PlantsVsZombiesHybrid.xcodeproj"',
              'encryption_include_filters=""',
              'encryption_exclude_filters=""',
              "encrypt_pck=false",
              "encrypt_directory=false",
              "",
              "[preset.0.options]",
              'custom_template/debug=""',
              'custom_template/release=""',
              'application/app_store_team_id=""',
              'application/provisioning_profile_uuid_debug=""',
              'application/provisioning_profile_uuid_release=""',
              f'application/name="{app_name}"',
              'application/info="Made with Godot Engine"',
              'application/signature=""',
              f'application/version="{version}.0"',
              f'application/bundle_identifier="{bundle_id}"',
              "application/categories=PackedStringArray()",
              f'application/short_version="{short_version}"',
              'application/min_ios_version="16.0"',
              "application/orientation/portrait=false",
              "application/orientation/landscape_left=true",
              "application/orientation/landscape_right=true",
              "application/orientation/portrait_upside_down=false",
              'application/interruption_policy="stop"',
              "application/supports_opengl=false",
              "application/supports_metal=true",
              "application/supports_open_gles2=false",
              "application/supports_open_gles3=true",
              "application/supports_vulkan=false",
              'application/icon="res://icon.png"',
              'application/additional_plist_content=""',
              "capabilities/access_wifi=false",
              "capabilities/push_notifications=false",
              "capabilities/performance_gaming=false",
              "capabilities/performance_a12=false",
              "user_data/accessible_files_directories=PackedStringArray()",
              'architecture/target="arm64"',
              "application/export_method_debug=0",
              "application/export_method_release=0",
              'application/code_sign_identity_debug=""',
              'application/code_sign_identity_release=""',
          ]
          with open("recovered/export_presets.cfg", "w") as f:
              f.write("\n".join(lines) + "\n")
          print("export_presets.cfg generated")
          GENEOF
          python3 generate_presets.py "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.bundle_id }}" "${{ github.event.inputs.version }}"

      - name: Install Godot 4.7.1 .NET
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_macos.universal.zip"
          unzip -q godot.zip -d godot_extracted
          mv godot_extracted/Godot_mono.app $HOME/Godot.app
          echo "$HOME/Godot.app/Contents/MacOS" >> $GITHUB_PATH
          godot --version

      - name: Install iOS export templates
        run: |
          curl -L -o templates.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_ios.universal.zip"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q templates.zip -d "$TEMPLATES_DIR"
          echo "Templates installed"

      - name: Export Xcode project
        run: |
          cd recovered
          godot --headless --export-release "iOS" ../PlantsVsZombiesHybrid.xcodeproj 2>&1 | tail -20
          ls ../PlantsVsZombiesHybrid.xcodeproj/

      - name: Build unsigned IPA
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          xcodebuild -project PlantsVsZombiesHybrid.xcodeproj \
            -scheme "${{ github.event.inputs.app_name }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/PlantsVsZombiesHybrid.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20
          cd ..
          mkdir -p build/ipa
          cat > build/export-options.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLISTEOF
          xcodebuild -exportArchive \
            -archivePath build/PlantsVsZombiesHybrid.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/export-options.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          IPA=$(find build/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA found"
            exit 1
          fi
          echo "IPA generated: $IPA"
          ls -la "$IPA"
          IPA_NAME="pvz-hybrid-${{ github.event.inputs.version }}.ipa"
          cp "$IPA" "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Create Release and upload IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${{ github.event.inputs.version }}"
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG exists, uploading IPA..."
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --title "${{ github.event.inputs.app_name }} $RELEASE_TAG" --notes "iOS build for $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "${{ env.IPA_NAME }}" --clobber
          echo "IPA uploaded to release $RELEASE_TAG"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvz-hybrid-ipa
          path: ${{ env.IPA_NAME }}
