name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application name'
        required: false
        default: 'PlantsVsZombies Hybrid'
        type: string
      bundle_id:
        description: 'Bundle identifier'
        required: false
        default: 'com.plantsvszombies.hybrid'
        type: string
      version:
        description: 'Version number'
        required: false
        default: '0.25.5'
        type: string
      team_id:
        description: 'Apple Developer Team ID (10 chars, use AAAAAAAAAA for unsigned)'
        required: false
        default: 'AAAAAAAAAA'
        type: string
      force_recover:
        description: 'Force GDRE extract (disable cache)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ========== 标准化 version 输入 ==========
      - name: Normalize version
        id: normver
        run: |
          VER="${{ github.event.inputs.version }}"
          VER="${VER#v}"
          echo "raw=$VER" >> "$GITHUB_OUTPUT"
          echo "Normalized version: $VER"

      # ========== 获取 GDRE 最新版本（用于缓存 key） ==========
      - name: 获取 GDRE 最新版本
        id: gdre-version-check
        run: |
          GDRE_VER=$(curl -s --max-time 10 https://api.github.com/repos/GDRETools/gdsdecomp/releases/latest | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['tag_name'])" 2>/dev/null || echo "")
          if [ -z "$GDRE_VER" ]; then
            GDRE_VER="v2.6.3"
            echo "WARNING: GitHub API unavailable, using fallback GDRE version $GDRE_VER"
          fi
          echo "gdre_version=$GDRE_VER" >> "$GITHUB_OUTPUT"
          echo "GDRE latest: $GDRE_VER"

      # ========== 断点恢复：尝试拉取上次 extract 产物 ==========
      - name: 拉取阶段1-GDRE提取产物
        if: ${{ !inputs.force_recover }}
        id: extract-stage
        uses: actions/cache/restore@v5
        with:
          path: recovered/
          key: gdre-extract-${{ runner.os }}-${{ steps.normver.outputs.raw }}-${{ steps.gdre-version-check.outputs.gdre_version }}-${{ github.sha }}

      # ========== 判断缓存是否有效 ==========
      - name: 判断缓存是否有效
        id: cache-valid
        run: |
          CACHE_HIT="${{ steps.extract-stage.outputs.cache-hit }}"
          if [ "$CACHE_HIT" = "true" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Exact cache hit, good"
          elif [ -d recovered ] && [ -f "recovered/project.godot" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Cache restored via restore-keys (recovered/ exists)"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "No cache, need to download and extract"
          fi

      # ========== 阶段1：下载 + GDRE extract ==========
      - name: Download ZIP from Release
        if: steps.cache-valid.outputs.valid != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ steps.normver.outputs.raw }}"
          gh release download "$RELEASE_TAG" --pattern "source.zip"
          ls -la source.zip

      - name: Install 7-Zip (Deflate64 support)
        if: steps.cache-valid.outputs.valid != 'true'
        run: |
          brew list p7zip &>/dev/null || brew install p7zip

      - name: Unzip project
        if: steps.cache-valid.outputs.valid != 'true'
        run: |
          7z x source.zip -oextracted -y
          ls extracted/

      - name: Setup Java 17
        if: steps.cache-valid.outputs.valid != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install GDRE
        id: gdre-install
        if: steps.cache-valid.outputs.valid != 'true'
        run: |
          GDRE_VERSION="${{ steps.gdre-version-check.outputs.gdre_version }}"
          echo "GDRE version: $GDRE_VERSION"
          curl -L -o gdre-macos.zip "https://github.com/GDRETools/gdsdecomp/releases/download/${GDRE_VERSION}/GDRE_tools-${GDRE_VERSION}-macos.zip"
          unzip -q gdre-macos.zip -d gdre_extracted
          GDRE_BIN="gdre_extracted/Godot RE Tools.app/Contents/MacOS/Godot RE Tools"
          chmod +x "$GDRE_BIN"
          echo "GDRE installed: $GDRE_BIN ($GDRE_VERSION)"
          "$GDRE_BIN" --help 2>&1 | head -5 || true

      - name: Find and extract PCK (raw extract, no decompile)
        id: extract
        if: steps.cache-valid.outputs.valid != 'true'
        run: |
          PCK=$(find extracted -name "*.pck" | head -1)
          if [ -z "$PCK" ]; then
            echo "ERROR: No PCK file found"
            exit 1
          fi
          echo "Found PCK: $PCK"
          mkdir -p recovered
          GDRE_BIN="gdre_extracted/Godot RE Tools.app/Contents/MacOS/Godot RE Tools"
          echo "=== Running GDRE --extract ==="
          "$GDRE_BIN" --extract="$PCK" --output=recovered/ 2>&1 | tail -30
          echo "=== Extracted files (top 20) ==="
          ls recovered/ | head -20
          echo "=== Total files ==="
          find recovered/ -type f | wc -l
          echo "=== .dll files ==="
          find recovered/ -name "*.dll" | head -20
          echo "=== project.godot exists? ==="
          test -f recovered/project.godot && echo "YES" || echo "NO"

          # ===== dll 流程：收集 source.zip 中的预编译 IL 程序集 =====
          # PCK 只含资源（C# 脚本是 1 字节空占位，不可编译）。
          # 游戏程序集在 Windows 自包含发布目录 data_* 中，为 net9.0 IL dll，
          # 可直接被 Godot iOS NativeAOT 消费，无需编译任何 .cs 源码。
          mkdir -p recovered/.prebuilt
          DLL_SRC=$(find extracted -maxdepth 3 -type d -name "data_*" | head -1)
          if [ -n "$DLL_SRC" ]; then
            echo "Prebuilt dll dir: $DLL_SRC"
            for f in "$DLL_SRC"/*.dll; do
              [ -f "$f" ] || continue
              b=$(basename "$f")
              case "$b" in
                System.*|System.Private*|Microsoft.CodeAnalysis*|Microsoft.DiaSymReader*|GodotSharp.dll|GodotSharpEditor.dll|coreclr*|clr*.dll|hostfxr*|hostpolicy*|mscor*|msquic*|System.IO.Compression.Native*|System.Security.Cryptography.Native*|*.resources.dll)
                  echo "SKIP runtime/framework: $b" ;;
                *)
                  cp "$f" recovered/.prebuilt/
                  echo "COPY prebuilt: $b" ;;
              esac
            done
            ls -la recovered/.prebuilt/
          else
            echo "WARNING: no data_* dir found — prebuilt dll flow unavailable"
          fi

      # ========== 强制保存阶段1缓存 ==========
      - name: 强制保存阶段1缓存
        id: save-stage1
        if: steps.cache-valid.outputs.valid != 'true'
        uses: actions/cache/save@v5
        with:
          path: recovered/
          key: gdre-extract-${{ runner.os }}-${{ steps.normver.outputs.raw }}-${{ steps.gdre-version-check.outputs.gdre_version }}-${{ github.sha }}

      - name: 保存阶段1产物（失败也保存）
        if: always() && (steps.cache-valid.outputs.valid != 'true')
        uses: actions/upload-artifact@v6
        with:
          name: stage-extracted
          path: recovered/
          retention-days: 7

      # ========== 阶段2：探测版本 + 安装 Godot ==========
      - name: Detect Godot version from project.godot
        id: detect
        run: |
          set -euo pipefail
          # 从 project.godot 读 Godot 版本
          GODOT_VER="4.7.0"
          if [ -f "recovered/project.godot" ]; then
            DETECTED=$(grep -i '^config/features=' recovered/project.godot | grep -oP '"[0-9]+\.[0-9]+' | head -1 | tr -d '"' || true)
            if [ -n "$DETECTED" ]; then
              GODOT_VER="$DETECTED"
            fi
          fi
          GODOT_STABLE="${GODOT_VER}-stable"
          echo "godot_version=$GODOT_STABLE" >> $GITHUB_OUTPUT
          echo "godot_cache_key=godot-${GODOT_STABLE}-${{ runner.os }}" >> $GITHUB_OUTPUT
          echo "Godot: $GODOT_STABLE"

      # ===== dll 流程前置：C# NativeAOT 工具链 =====
      # 预编译 dll 复用依赖 dotnet publish + iOS workload 的 ilc，
      # 没有它们 Godot Mono iOS 导出会静默失败（历史 run 已证实）。
      - name: Setup .NET SDK for AOT compilation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET iOS Workload
        run: |
          dotnet workload install ios
          echo ".NET iOS workload installed."

      - name: Generate export_presets.cfg
        run: |
          python3 .github/workflows/generate_presets.py "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.bundle_id }}" "${{ github.event.inputs.version }}" "${{ github.event.inputs.team_id }}"

      - name: Install Godot
        id: godot-cache
        uses: actions/cache/restore@v5
        with:
          path: /Users/runner/Godot.app
          key: ${{ steps.detect.outputs.godot_cache_key }}

      - name: Download and install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          GODOT_VER="${{ steps.detect.outputs.godot_version }}"
          GODOT_VER_CDN="${GODOT_VER%.0-stable}-stable"
          echo "Downloading Godot $GODOT_VER Mono (CDN: $GODOT_VER_CDN)"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER_CDN}/Godot_v${GODOT_VER_CDN}_mono_macos.universal.zip"
          unzip -q godot.zip -d godot_extracted
          mv godot_extracted/Godot_mono.app $HOME/Godot.app
          GODOT="$HOME/Godot.app/Contents/MacOS"
          echo "$GODOT" >> $GITHUB_PATH
          "$GODOT/Godot" --version

      - name: 强制保存 Godot 缓存
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /Users/runner/Godot.app
          key: ${{ steps.detect.outputs.godot_cache_key }}

      - name: 确保 Godot 在 PATH 中
        if: steps.godot-cache.outputs.cache-hit == 'true'
        run: |
          GODOT="$HOME/Godot.app/Contents/MacOS"
          if [ -d "$GODOT" ]; then
            echo "$GODOT" >> $GITHUB_PATH
            "$GODOT/Godot" --version
            echo "Godot restored from cache and added to PATH"
          else
            echo "ERROR: Godot.app not found at $HOME/Godot.app despite cache hit"
            ls -la $HOME/ | head -10
            exit 1
          fi

      - name: Install iOS export templates
        run: |
          set -euo pipefail
          GODOT_VER="${{ steps.detect.outputs.godot_version }}"
          echo "Downloading export templates for Godot $GODOT_VER"
          GODOT_VER_CDN="${GODOT_VER%.0-stable}-stable"
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER_CDN}/Godot_v${GODOT_VER_CDN}_mono_export_templates.tpz"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VER_CDN/-/.}.mono"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q templates.tpz -d /tmp/templates_extract
          cp -r /tmp/templates_extract/templates/* "$TEMPLATES_DIR/"
          echo "Templates installed"
          ls "$TEMPLATES_DIR/"

      # ========== 清理 extract 产物中的编辑器残留 ==========
      - name: Clean up editor-only addons from extracted files
        run: |
          set -euo pipefail
          cd recovered
          echo "=== Removing ModEditor addon (editor-only) ==="
          rm -rf addons/ModEditor/ 2>/dev/null || true
          rm -f addons/AdobeAnimateEditor/Tools/XWAdobeAnimateImportService.cs 2>/dev/null || true
          echo "=== Remaining addons ==="
          ls -d addons/*/ 2>/dev/null || echo "No addons"
          echo "=== Size ==="
          du -sh . | cut -f1
          cd ..

      - name: Convert project.binary to project.godot and patch display
        run: |
          cd recovered
          # GDRE --extract outputs project.binary (ECFG binary format).
          # Godot can read it, but text patching requires project.godot.
          # Reliable conversion: ProjectSettings.save() writes loaded settings back as text.
          if [ -f project.binary ] && [ ! -f project.godot ]; then
            echo "=== Converting project.binary to project.godot via Godot ==="
            cat > convert_settings.gd <<'EOF'
          extends SceneTree
          func _init():
              ProjectSettings.save()
              print("project.godot saved")
              quit()
          EOF
            # macOS has no `timeout` command; use perl's alarm (120s for big projects)
            perl -e 'alarm 120; exec @ARGV' godot --headless --path "$PWD" --script convert_settings.gd 2>&1 || true
            rm -f convert_settings.gd
            if [ -f project.godot ]; then
              echo "project.godot generated successfully"
            else
              echo "WARNING: project.godot not generated, will try using project.binary directly"
            fi
          fi
          # Patch display settings if project.godot exists
          if [ -f project.godot ]; then
            echo "=== Patching project.godot for iPad fullscreen ==="
            python3 ../.github/workflows/clean_project_godot.py project.godot
            if ! grep -q '^\[display\]' project.godot; then
              echo "" >> project.godot
              echo "[display]" >> project.godot
            fi
            sed -i '' '/^window\/stretch\/mode/d' project.godot
            sed -i '' '/^window\/stretch\/aspect/d' project.godot
            sed -i '' '/^window\/stretch\/scale/d' project.godot
            sed -i '' '/^window\/size\/viewport_width/d' project.godot
            sed -i '' '/^window\/size\/viewport_height/d' project.godot
            sed -i '' '/^window\/size\/window_width_override/d' project.godot
            sed -i '' '/^window\/size\/window_height_override/d' project.godot
            python3 ../.github/workflows/patch_godot_display.py project.godot
            echo "=== Patched [display] section ==="
            grep -A 10 '^\[display\]' project.godot | head -15
          else
            echo "No project.godot, display patch skipped (using project.binary)"
          fi
          # ===== 关键修复：删除旧 project.binary =====
          # GDRE 提取的 project.binary 是原版配置（1080x600 / keep_height）。
          # Godot 加载项目时优先读 project.binary，导致上面 patch 的
          # project.godot 根本不被使用，显示配置永远不生效。
          # 删除后 Godot 只读 patch 后的 project.godot，导出/打包时
          # 生成的 project.binary 才会包含 iPad 全屏配置。
          if [ -f project.binary ]; then
            echo "=== Removing original project.binary (use patched project.godot) ==="
            rm -f project.binary
          fi
          # ===== 备份纹理导入缓存 =====
          # 完整纹理在 .godot/imported/（3683 个 ctex，~478MB）。
          # 后续 Godot export 可能把源文件缺失的资源当作无效缓存清理，
          # 备份到 /tmp，打包完整 pck 前恢复。
          if [ -d .godot/imported ]; then
            IMP_COUNT=$(find .godot/imported -type f | wc -l | tr -d ' ')
            echo "=== Backing up .godot/imported ($IMP_COUNT files) ==="
            rm -rf /tmp/imported_backup
            mkdir -p /tmp/imported_backup
            cp -R .godot/imported /tmp/imported_backup/
            echo "imported backup done: $(du -sh /tmp/imported_backup | cut -f1)"
          else
            echo "WARNING: no .godot/imported found at backup time"
          fi
          cd ..

      # ===== dll 流程：生成 C# 项目，复用 source.zip 预编译 IL 程序集 =====
      # extract 模式的 .cs 是 1 字节空占位，编译必然失败（历史 3870 错误）。
      # 正确做法：生成最小 csproj（不编译任何源码），CoreCompile 后把
      # .prebuilt/ 的 net9.0 IL dll 复制进输出目录，NativeAOT 直接编译它们。
      - name: Generate C# project (reuse prebuilt dlls)
        run: |
          set -euo pipefail
          cd recovered
          SDK_VERSION="${{ steps.detect.outputs.godot_version }}"
          SDK_VERSION="${SDK_VERSION%-stable}"
          echo "Godot.NET.Sdk version: $SDK_VERSION"

          python3 - "$SDK_VERSION" <<'PYEOF'
          import sys, uuid, glob, os, re
          sdk = sys.argv[1]

          # 1) 选游戏主程序集：优先 PlantsVsZombies.dll；否则排除框架/第三方 dll 后取第一个
          dlls = sorted(glob.glob(".prebuilt/*.dll"))
          exclude_prefix = ("GodotSharp", "System", "Microsoft", "netstandard", "ZLogger", "ZString", "Utf8")
          game = next((d for d in dlls if os.path.basename(d).startswith("PlantsVsZombies.")), None)
          if game is None:
              game = next((d for d in dlls if not os.path.basename(d).startswith(exclude_prefix)), None)
          if game is None:
              print("ERROR: no prebuilt game assembly in recovered/.prebuilt/ (dll flow requires source.zip data_* dir)")
              sys.exit(1)
          asm = os.path.basename(game)[:-4]
          print(f"Prebuilt assembly: {asm}")

          # 2) assembly_name 必须位于 project.godot 的 [dotnet] 节，否则 Godot 不识别 .NET 项目、跳过 publish
          if os.path.exists("project.godot"):
              with open("project.godot") as f:
                  text = f.read()
              lines = text.splitlines()
              out, in_dotnet = [], False
              for ln in lines:
                  if ln.lstrip().startswith("["):
                      in_dotnet = (ln.strip() == "[dotnet]")
                  if re.match(r'^\s*dotnet/project/assembly_name\s*=', ln) and not in_dotnet:
                      continue  # 删除之前 append 错位的行
                  out.append(ln)
              text = "\n".join(out)
              if re.search(r'^\s*dotnet/project/assembly_name\s*=', text, re.M):
                  text = re.sub(r'^\s*dotnet/project/assembly_name\s*=.*$',
                                f'dotnet/project/assembly_name="{asm}"', text, count=1, flags=re.M)
              else:
                  text = text.rstrip() + f'\n\n[dotnet]\n\nproject/assembly_name="{asm}"\n'
              with open("project.godot", "w") as f:
                  f.write(text)
              print(f"project.godot [dotnet] assembly_name={asm}")

          # 3) 最小 csproj：不编译源码；引用依赖 dll（排除自身避免自引用冲突）；把全部预编译 dll 复制进输出
          refs = []
          for d in dlls:
              if os.path.abspath(d) == os.path.abspath(game):
                  continue
              fn = os.path.basename(d)[:-4]
              refs.append(f'    <Reference Include="{fn}">\n        <HintPath>{d}</HintPath>\n        <Private>true</Private>\n    </Reference>')
          ref_xml = "\n".join(refs)
          csproj = f'''<Project Sdk="Godot.NET.Sdk/{sdk}">
            <PropertyGroup>
              <TargetFramework>net9.0</TargetFramework>
              <EnableDynamicLoading>true</EnableDynamicLoading>
              <RootNamespace>{asm}</RootNamespace>
              <AssemblyName>{asm}</AssemblyName>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <NoWarn>CS2008</NoWarn>
              <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
              <PublishTrimmed>false</PublishTrimmed>
            </PropertyGroup>
            <ItemGroup>
          {ref_xml}
              <PrebuiltDll Include=".prebuilt/*.dll" />
              <TrimmerRootAssembly Include="{asm}" />
            </ItemGroup>
            <Target Name="CopyPrebuiltDlls" AfterTargets="CoreCompile" BeforeTargets="ILCompiler">
              <!-- 用真游戏 dll 覆盖编译空壳：必须先覆盖 obj（IntermediateOutputPath），
                   否则 CopyFilesToOutputDirectory 会从 obj 把空壳复制到 bin 覆盖真 dll；
                   再覆盖 TargetDir 兜底，确保 ILC（NativeAOT）读取到的是含游戏类的真程序集 -->
              <Copy SourceFiles="@(PrebuiltDll)" DestinationFolder="$(IntermediateOutputPath)" SkipUnchangedFiles="false" />
              <Copy SourceFiles="@(PrebuiltDll)" DestinationFolder="$(TargetDir)" SkipUnchangedFiles="false" />
            </Target>
          </Project>
          '''
          guid = str(uuid.uuid4()).upper()
          sln = f'''Microsoft Visual Studio Solution File, Format Version 12.00
          # Visual Studio Version 17
          VisualStudioVersion = 17.0.31903.59
          MinimumVisualStudioVersion = 10.0.40219.1
          Project("{{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}}") = "{asm}", "{asm}.csproj", "{{{guid}}}"
          EndProject
          Global
          \tGlobalSection(SolutionConfigurationPlatforms) = preSolution
          \t\tDebug|Any CPU = Debug|Any CPU
          \t\tExportDebug|Any CPU = ExportDebug|Any CPU
          \t\tExportRelease|Any CPU = ExportRelease|Any CPU
          \tEndGlobalSection
          \tGlobalSection(ProjectConfigurationPlatforms) = postSolution
          \t\t{{{guid}}}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
          \t\t{{{guid}}}.Debug|Any CPU.Build.0 = Debug|Any CPU
          \t\t{{{guid}}}.ExportDebug|Any CPU.ActiveCfg = ExportDebug|Any CPU
          \t\t{{{guid}}}.ExportDebug|Any CPU.Build.0 = ExportDebug|Any CPU
          \t\t{{{guid}}}.ExportRelease|Any CPU.ActiveCfg = ExportRelease|Any CPU
          \t\t{{{guid}}}.ExportRelease|Any CPU.Build.0 = ExportRelease|Any CPU
          \tEndGlobalSection
          EndGlobal
          '''
          with open(f"{asm}.csproj", "w") as f:
              f.write(csproj)
          with open(f"{asm}.sln", "w") as f:
              f.write(sln)
          print("=== Generated files ===")
          print(csproj)
          PYEOF
          echo "=== Generated files ==="
          ls -la *.csproj *.sln
          cd ..

      - name: Manual dotnet publish verification
        run: |
          set -euo pipefail
          cd recovered
          echo "=== dotnet info ==="
          which dotnet || echo "dotnet not in PATH"
          dotnet --version || true
          echo "=== manual publish (csproj validity + NativeAOT trigger) ==="
          set +e
          dotnet publish PlantsVsZombies.csproj -c ExportRelease -r ios-arm64 --self-contained true -p:GodotTargetPlatform=iOS -o /tmp/publish-manual-test -v:m
          PUB_EXIT=$?
          set -e
          echo "PUBLISH_EXIT=$PUB_EXIT"
          if [ -d /tmp/publish-manual-test ]; then
            echo "=== publish output ==="
            ls -la /tmp/publish-manual-test/ | head -40
            echo "--- aotdata ---"
            find /tmp/publish-manual-test -name "*.aotdata" | head -20
          else
            echo "no publish output dir"
          fi

      - name: Export Xcode project (ignore xcodebuild failure, we build manually)
        run: |
          set -euo pipefail
          cd recovered
          # Godot --export-release does two things:
          #   1. Run dotnet publish (C# -> NativeAOT .aotdata) then generate .xcodeproj
          #   2. Run xcodebuild archive (fails on unsigned builds due to signing conflict)
          # We keep the FULL log so the publish stage is visible, then ignore step 2 failure.
          set +e
          set +o pipefail
          godot --headless --verbose --export-release "iOS" ../PlantsVsZombiesHybrid.xcodeproj > /tmp/godot_export.log 2>&1
          GODOT_EXIT=$?
          set -e
          set -o pipefail
          echo "======== Godot export: dotnet/publish/aot key lines ========"
          grep -n -i "publish\|aotdata\|NativeAOT\|dotnet\|\.dll\b\|MSB\|error CS\|Failed to publish\|building solution\|Running:\|GodotTargetPlatform\|ExportRelease-ios" /tmp/godot_export.log | head -80 || true
          echo "======== Godot export: last 50 lines ========"
          tail -50 /tmp/godot_export.log
          cd ..
          cp /tmp/godot_export.log ./godot_export.log || true
          if [ ! -d "PlantsVsZombiesHybrid.xcodeproj" ]; then
            echo "ERROR: Godot failed to generate .xcodeproj (exit $GODOT_EXIT)"
            ls -la
            exit 1
          fi
          echo "xcodeproj generated (Godot exit=$GODOT_EXIT, xcodebuild archive failure is expected for unsigned builds)"
          ls PlantsVsZombiesHybrid.xcodeproj/
          echo "======== C# artifacts in generated xcodeproj ========"
          find PlantsVsZombiesHybrid.xcodeproj -name "*.aotdata" -o -name "*.dll" -o -name "*.xcframework" 2>/dev/null | head -20 || true
          echo "======== Godot 4.7 publish output dir (.godot/mono/temp/bin) ========"
          find recovered/.godot/mono/temp/bin -maxdepth 4 -type d 2>/dev/null | head -30 || true
          echo "--- publish artifacts (dll/dylib/aotdata) ---"
          find recovered/.godot/mono/temp/bin -name "*.dll" -o -name "*.dylib" -o -name "*.aotdata" 2>/dev/null | head -40 || true
          echo "--- xcframework ---"
          find recovered/.godot/mono/temp/bin -name "*.xcframework" 2>/dev/null | head -10 || true
          AOT_COUNT=$(find recovered/.godot/mono/temp/bin -name "*.aotdata" 2>/dev/null | wc -l | tr -d ' ')
          echo "aotdata_count=$AOT_COUNT"
          SCHEME=$(python3 .github/workflows/detect_scheme.py)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Detected scheme: $SCHEME"

      - name: Upload godot export log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: godot-export-log
          path: godot_export.log
          retention-days: 7

      - name: Fix signing conflict in project.pbxproj
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          # 先修复 Godot 生成的 pbxproj 语法（files 数组缺逗号等），否则后续
          # sed / fix_frameworks.py 修改后 xcodebuild 会报 parse error
          python3 ../.github/workflows/fix_pbxproj_syntax.py project.pbxproj || true
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = "Manual";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = "Automatic";/CODE_SIGN_STYLE = "Manual";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = Apple[^;]*;/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = iPhone[^;]*;/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = "YES";/CODE_SIGNING_REQUIRED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = "YES";/CODE_SIGNING_ALLOWED = NO;/g' project.pbxproj
          echo "Fixed project.pbxproj signing settings"
          grep -E "CODE_SIGN" project.pbxproj | head -20

      - name: Fix missing framework links (Metal/QuartzCore/CoreAudio)
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          python3 ../.github/workflows/fix_frameworks.py
          echo "=== Verify frameworks in pbxproj ==="
          grep -c "Metal.framework" project.pbxproj || true
          grep -c "QuartzCore.framework" project.pbxproj || true
          grep -c "CoreAudio.framework" project.pbxproj || true

      - name: 保存阶段2产物（失败也保存）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage-xcodeproj
          path: PlantsVsZombiesHybrid.xcodeproj/
          retention-days: 7

      # ========== 阶段3：构建 IPA + 完整性验证 ==========
      - name: Build unsigned IPA
        id: build-ipa
        run: |
          set -euo pipefail
          SCHEME="${SCHEME//\"}"
          SCHEME="${SCHEME:-${{ github.event.inputs.app_name }}}"
          echo "Building with scheme: $SCHEME"
          xcodebuild -project PlantsVsZombiesHybrid.xcodeproj -list 2>&1 | head -20

          set +e
          set +o pipefail
          xcodebuild -project PlantsVsZombiesHybrid.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > /tmp/xcodebuild.log 2>&1
          XCODE_EXIT=$?
          set -e
          set -o pipefail
          echo "======== xcodebuild last 80 lines ========"
          tail -80 /tmp/xcodebuild.log
          cp /tmp/xcodebuild.log ./xcodebuild.log || true
          if [ "$XCODE_EXIT" -ne 0 ]; then
            echo "ERROR: xcodebuild failed with exit code $XCODE_EXIT"
            echo "======== xcodebuild error lines ========"
            grep -n -i "error:\|fatal\|BUILD FAILED\|Undefined\|ld:" /tmp/xcodebuild.log | tail -40 || true
            exit "$XCODE_EXIT"
          fi

          APP_DIR="build/Build/Products/Release-iphoneos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found in $APP_DIR"
            find build -name "*.app" 2>/dev/null || echo "No .app found at all"
            exit 1
          fi
          echo "APP found: $APP"
          ls -la "$APP" | head -5

          # ========== 完整性验证：检查 C# NativeAOT 产物 ==========
          # Godot 4.7 iOS .NET 导出流程：
          #   dotnet publish (NativeAOT) -> PlantsVsZombies.dylib -> PlantsVsZombies_aot.xcframework
          #   -> xcodebuild 嵌入为 Frameworks/PlantsVsZombies.framework
          # 因此 app 内没有 .dll / .aotdata / GodotSharp 是正常现象（IL 已编译为原生代码）。
          echo "=== Integrity check: C# NativeAOT runtime ==="
          HAS_AOT_FRAMEWORK=false

          if [ -d "$APP/Frameworks" ]; then
            echo "  [PASS] Frameworks/ exists"
            ls "$APP/Frameworks/"
            # C# NativeAOT 代码载体：PlantsVsZombies.framework
            if [ -d "$APP/Frameworks/PlantsVsZombies.framework" ]; then
              HAS_AOT_FRAMEWORK=true
              echo "  [PASS] PlantsVsZombies.framework found (C# NativeAOT code embedded)"
            else
              echo "  [WARN] PlantsVsZombies.framework not found in Frameworks/"
            fi
          else
            echo "  [FAIL] No Frameworks/ directory"
          fi

          DLL_COUNT=$(find "$APP" -name "*.dll" 2>/dev/null | wc -l)
          if [ "$DLL_COUNT" -gt 0 ]; then
            echo "  [WARN] Found $DLL_COUNT .dll files (unexpected for NativeAOT, IL should be compiled)"
            find "$APP" -name "*.dll" | head -5
          else
            echo "  [INFO] No .dll files (expected for NativeAOT)"
          fi

          AOT_COUNT=$(find "$APP" -name "*.aotdata" 2>/dev/null | wc -l)
          if [ "$AOT_COUNT" -gt 0 ]; then
            echo "  [INFO] Found $AOT_COUNT .aotdata files"
            find "$APP" -name "*.aotdata" | head -5
          else
            echo "  [INFO] No .aotdata files (expected: Godot 4.7 uses dylib/xcframework, not .aotdata)"
          fi

          # 关键检查：必须存在 C# NativeAOT framework（C# 代码被打包的证据）
          if [ "$HAS_AOT_FRAMEWORK" = false ]; then
            echo ""
            echo "============================================"
            echo "INTEGRITY CHECK FAILED: No C# NativeAOT framework found!"
            echo "Frameworks/PlantsVsZombies.framework missing."
            echo "This IPA will crash on launch (no C# runtime)."
            echo "============================================"
            exit 1
          fi

          # 关键检查：dylib 里必须真有游戏代码（防止空壳程序集再次通过）
          # 历史踩坑：csproj EnableDefaultCompileItems=false + 无 Compile 项 ->
          # ILC 编译的是空壳程序集，dylib 只有 GodotSharp 桥接，游戏类为 0，
          # 运行时找不到 C# 脚本类 -> 卡第一屏。
          DYLIB_BIN=$(find "$APP/Frameworks/PlantsVsZombies.framework" -type f -maxdepth 2 | head -1)
          echo "  [INFO] Checking game symbols in: $DYLIB_BIN"
          GAME_SYMBOL_COUNT=$(strings "$DYLIB_BIN" 2>/dev/null | grep -c -E "CoinBank|TowerDefense|PlantsVsZombies\." || true)
          if [ "$GAME_SYMBOL_COUNT" -lt 5 ]; then
            echo ""
            echo "============================================"
            echo "INTEGRITY CHECK FAILED: NativeAOT dylib has no game code!"
            echo "strings found only $GAME_SYMBOL_COUNT game symbols."
            echo "Game classes were trimmed/never compiled -> app hangs on first screen."
            echo "============================================"
            exit 1
          fi
          echo "  [PASS] dylib contains game code ($GAME_SYMBOL_COUNT game symbols)"

          echo ""
          echo "=== Integrity check PASSED ==="

          # ========== 完整资源 pck：PCKPacker 纯复制打包 ==========
          # Godot 重导出生成的 pck 只有文本资源（源纹理缺失 -> 导入失败 ->
          # 纹理全丢，IPA 只有 60MB 跑不起来）。正确做法：
          #   1. 恢复 .godot/imported 纹理缓存（从 25 步骤的备份）
          #   2. 从 xcodebuild 生成的 pck 提取 patch 后的 project.binary
          #      （25 步骤删除了旧 binary，Godot 现在用 patch 后的
          #       project.godot 生成，显示配置是 iPad 全屏）
          #   3. PCKPacker 纯复制 recovered/ 全部文件 -> complete.pck
          #   4. 替换 .app 里的 pck（Godot 生成的残缺版）
          echo "=== Restore .godot/imported texture cache ==="
          if [ -d /tmp/imported_backup/imported ]; then
            mkdir -p recovered/.godot
            rm -rf recovered/.godot/imported
            cp -R /tmp/imported_backup/imported recovered/.godot/
            echo "restored: $(find recovered/.godot/imported -type f | wc -l | tr -d ' ') files, $(du -sh recovered/.godot/imported | cut -f1)"
          else
            echo "WARNING: no imported backup found, check 25-step backup"
          fi

          echo "=== Extract patched project.binary from built pck ==="
          APP_PCK=$(find "$APP" -maxdepth 1 -name "*.pck" | head -1)
          if [ -z "$APP_PCK" ]; then
            echo "ERROR: no pck found in $APP"
            exit 1
          fi
          echo "Built pck: $APP_PCK ($(du -sh "$APP_PCK" | cut -f1))"
          python3 .github/workflows/extract_project_binary.py "$APP_PCK" /tmp/project_patched.binary

          echo "=== PCKPacker: build complete pck (keep textures) ==="
          (
            cd recovered
            # 用 find 生成文件列表（find 包含隐藏文件；GDScript DirAccess
            # 遍历在 4.7 下会跳过 .godot/ 或报参数错误，绕开它）
            find . -type f | sed 's|^\./||' \
              | grep -v '^\.prebuilt/' \
              | grep -v '^\.godot/mono/' \
              | grep -v '^\.godot/tmp/' \
              | grep -v '^\.godot/editor/' \
              | grep -v '^project\.binary$' \
              > /tmp/pck_filelist.txt
            echo "filelist: $(wc -l < /tmp/pck_filelist.txt | tr -d ' ') files"
            echo "imported in list: $(grep -c '^\.godot/imported/' /tmp/pck_filelist.txt | tr -d ' ') files"
            # 注意：-s 脚本路径必须是绝对路径（相对路径会被解析成 res:// 越界）
            godot --headless -s "$GITHUB_WORKSPACE/.github/workflows/pack_pck.gd"
          )
          ls -la /tmp/complete.pck

          echo "=== Verify complete pck ==="
          python3 .github/workflows/verify_pck.py /tmp/complete.pck

          echo "=== Replace pck in .app ==="
          cp /tmp/complete.pck "$APP_PCK"
          ls -la "$APP_PCK"

          APP_BASENAME=$(basename "$APP")
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" "ipa/Payload/$APP_BASENAME"
          IPA_NAME="pvz-hybrid-v${{ steps.normver.outputs.raw }}.ipa"
          (cd ipa && zip -qry "../$IPA_NAME" Payload)
          if [ ! -f "$IPA_NAME" ]; then
            echo "ERROR: IPA creation failed"
            exit 1
          fi
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          ls -la "$IPA_NAME"

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: 保存阶段3产物（失败也保存）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage-ipa
          path: pvz-hybrid-v*.ipa
          retention-days: 7

      - name: Create Release and upload IPA
        if: steps.build-ipa.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          RELEASE_TAG="v${{ steps.normver.outputs.raw }}"
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG exists, uploading IPA..."
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --title "${{ github.event.inputs.app_name }} $RELEASE_TAG" --notes "iOS build for $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "${{ env.IPA_NAME }}" --clobber
          echo "IPA uploaded to release $RELEASE_TAG"
