name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application name'
        required: false
        default: 'PlantsVsZombies Hybrid'
        type: string
      bundle_id:
        description: 'Bundle identifier'
        required: false
        default: 'com.plantsvszombies.hybrid'
        type: string
      version:
        description: 'Version number'
        required: false
        default: '0.25.5'
        type: string
      team_id:
        description: 'Apple Developer Team ID (10 chars, use AAAAAAAAAA for unsigned)'
        required: false
        default: 'AAAAAAAAAA'
        type: string

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ========== 断点恢复：尝试拉取上次中间产物 ==========
      - name: 拉取阶段1-GDRE恢复产物
        id: recover-stage
        uses: actions/cache/restore@v4
        with:
          path: recovered/
          key: gdre-recovery-${{ runner.os }}-${{ github.event.inputs.version }}
          restore-keys: |
            gdre-recovery-${{ runner.os }}-

      # ========== 阶段1：下载 + GDRE 恢复 ==========
      - name: Download ZIP from Release
        if: steps.recover-stage.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.event.inputs.version }}"
          gh release download "$RELEASE_TAG" --pattern "source.zip"
          ls -la source.zip

      - name: Install 7-Zip (Deflate64 support)
        if: steps.recover-stage.outputs.cache-hit != 'true'
        run: |
          brew install p7zip

      - name: Unzip project
        if: steps.recover-stage.outputs.cache-hit != 'true'
        run: |
          7z x source.zip -oextracted -y
          ls extracted/

      - name: Setup Java 17
        if: steps.recover-stage.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install GDRE
        if: steps.recover-stage.outputs.cache-hit != 'true'
        run: |
          curl -L -o gdre-macos.zip "https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.0/GDRE_tools-v2.6.0-macos.zip"
          unzip -q gdre-macos.zip -d gdre_extracted
          GDRE_BIN="gdre_extracted/Godot RE Tools.app/Contents/MacOS/Godot RE Tools"
          chmod +x "$GDRE_BIN"
          echo "GDRE installed: $GDRE_BIN"
          "$GDRE_BIN" --help 2>&1 | head -5 || true

      - name: Find and recover PCK
        id: recover
        if: steps.recover-stage.outputs.cache-hit != 'true'
        run: |
          PCK=$(find extracted -name "*.pck" | head -1)
          if [ -z "$PCK" ]; then
            echo "ERROR: No PCK file found"
            exit 1
          fi
          echo "Found PCK: $PCK"
          mkdir -p recovered
          GDRE_BIN="gdre_extracted/Godot RE Tools.app/Contents/MacOS/Godot RE Tools"
          "$GDRE_BIN" --recover="$PCK" --output=recovered/ 2>&1 | tail -20
          ls recovered/ | head -10

      # ========== 强制保存阶段1缓存（不管后面构建成不成） ==========
      - name: 强制保存阶段1缓存
        if: steps.recover-stage.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: recovered/
          key: gdre-recovery-${{ runner.os }}-${{ github.event.inputs.version }}

      - name: 保存阶段1产物（失败也保存）
        if: always() && steps.recover-stage.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: stage-recovered
          path: recovered/
          retention-days: 7

      # ========== 阶段2：从 .csproj 探测版本 + 安装 Godot ==========
      - name: Detect Godot and .NET versions from .csproj
        id: detect
        run: |
          CSPROJ="recovered/*.csproj"
          CSPROJ_FILE=$(ls $CSPROJ 2>/dev/null | head -1)
          if [ -z "$CSPROJ_FILE" ]; then
            echo "ERROR: No .csproj found in recovered/"
            exit 1
          fi
          echo "Found csproj: $CSPROJ_FILE"
          
          # 提取 Godot SDK 版本 (e.g. Godot.NET.Sdk/4.7.0)
          GODOT_SDK=$(grep -oP 'Godot\.NET\.Sdk/\K[0-9]+\.[0-9]+\.[0-9]+' "$CSPROJ_FILE" | head -1)
          if [ -z "$GODOT_SDK" ]; then
            GODOT_SDK=$(grep -oP 'Godot\.NET\.Sdk/\K[0-9]+\.[0-9]+' "$CSPROJ_FILE" | head -1)
          fi
          echo "Detected Godot SDK version: $GODOT_SDK"
          
          # 提取 TargetFramework (e.g. net90 -> 9.0)
          TF=$(grep -oP '<TargetFramework>\Knet[0-9]+' "$CSPROJ_FILE" | head -1)
          DOTNET_VER="${TF#net}"
          DOTNET_VER="${DOTNET_VER:0:1}.${DOTNET_VER:1}"
          echo "Detected .NET version: $DOTNET_VER"
          
          # 构建 Godot 下载版本号 (4.7.0-stable)
          GODOT_STABLE="${GODOT_SDK}-stable"
          echo "godot_version=$GODOT_STABLE" >> $GITHUB_OUTPUT
          echo "dotnet_version=$DOTNET_VER" >> $GITHUB_OUTPUT
          echo "godot_cache_key=godot-${GODOT_STABLE}-dotnet-macos" >> $GITHUB_OUTPUT
          echo "Godot version: $GODOT_STABLE, .NET: $DOTNET_VER"

      - name: Generate export_presets.cfg
        run: |
          cat > generate_presets.py << 'GENEOF'
          import sys
          app_name = sys.argv[1]
          bundle_id = sys.argv[2]
          version = sys.argv[3]
          team_id = sys.argv[4]
          short_version = version

          lines = [
              "[preset.0]",
              'name="iOS"',
              'platform="iOS"',
              "runnable=true",
              "advanced_options=false",
              "dedicated_server=false",
              'custom_features=""',
              'export_filter="all_resources"',
              'include_filter=""',
              'exclude_filter=""',
              'export_path="../PlantsVsZombiesHybrid.xcodeproj"',
              'encryption_include_filters=""',
              'encryption_exclude_filters=""',
              "encrypt_pck=false",
              "encrypt_directory=false",
              "",
              "[preset.0.options]",
              'custom_template/debug=""',
              'custom_template/release=""',
              f'application/app_store_team_id="{team_id}"',
              'application/provisioning_profile_uuid_debug=""',
              'application/provisioning_profile_uuid_release=""',
              f'application/name="{app_name}"',
              'application/info="Made with Godot Engine"',
              'application/signature=""',
              f'application/version="{version}.0"',
              f'application/bundle_identifier="{bundle_id}"',
              "application/categories=PackedStringArray()",
              f'application/short_version="{short_version}"',
              'application/min_ios_version="16.0"',
              "application/orientation/portrait=false",
              "application/orientation/landscape_left=true",
              "application/orientation/landscape_right=true",
              "application/orientation/portrait_upside_down=false",
              'application/interruption_policy="stop"',
              "application/supports_opengl=false",
              "application/supports_metal=true",
              "application/supports_open_gles2=false",
              "application/supports_open_gles3=true",
              "application/supports_vulkan=false",
              'application/icon="res://icon.png"',
              'application/additional_plist_content=""',
              "capabilities/access_wifi=false",
              "capabilities/push_notifications=false",
              "capabilities/performance_gaming=false",
              "capabilities/performance_a12=false",
              "user_data/accessible_files_directories=PackedStringArray()",
              'architecture/target="arm64"',
              "application/export_method_debug=0",
              "application/export_method_release=0",
              'application/code_sign_identity_debug=""',
              'application/code_sign_identity_release=""',
          ]
          with open("recovered/export_presets.cfg", "w") as f:
              f.write("\n".join(lines) + "\n")
          print("export_presets.cfg generated")
          GENEOF
          python3 generate_presets.py "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.bundle_id }}" "${{ github.event.inputs.version }}" "${{ github.event.inputs.team_id }}"

      - name: Setup .NET SDK (detected version)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ steps.detect.outputs.dotnet_version }}.x'

      - name: Install .NET iOS Workload
        run: |
          dotnet workload install ios
          echo ".NET iOS workload installed successfully."

      - name: Restore NuGet packages and build C# project
        run: |
          cd recovered
          CSPROJ=$(ls *.csproj | head -1)
          echo "Building C# project: $CSPROJ"
          dotnet restore "$CSPROJ" 2>&1 | tail -20
          dotnet build "$CSPROJ" -c Release 2>&1 | tail -30
          echo "=== Build output ==="
          ls -la bin/Release/*/ 2>/dev/null || echo "No bin/Release output"
          cd ..

      - name: Install Godot (detected version)
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/Godot.app
          key: ${{ steps.detect.outputs.godot_cache_key }}

      - name: Download and install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          GODOT_VER="${{ steps.detect.outputs.godot_version }}"
          echo "Downloading Godot $GODOT_VER Mono"
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_mono_macos.universal.zip"
          unzip -q godot.zip -d godot_extracted
          mv godot_extracted/Godot_mono.app $HOME/Godot.app
          GODOT="$HOME/Godot.app/Contents/MacOS"
          echo "$GODOT" >> $GITHUB_PATH
          "$GODOT/Godot" --version

      - name: 强制保存 Godot 缓存
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/Godot.app
          key: ${{ steps.detect.outputs.godot_cache_key }}

      - name: 确保 Godot 在 PATH 中
        if: steps.godot-cache.outputs.cache-hit == 'true'
        run: |
          GODOT="$HOME/Godot.app/Contents/MacOS"
          if [ -d "$GODOT" ]; then
            echo "$GODOT" >> $GITHUB_PATH
            "$GODOT/Godot" --version
            echo "Godot restored from cache and added to PATH"
          else
            echo "ERROR: Godot.app not found at $HOME/Godot.app despite cache hit"
            ls -la $HOME/ | head -10
            exit 1
          fi

      - name: Install iOS export templates (detected version)
        run: |
          GODOT_VER="${{ steps.detect.outputs.godot_version }}"
          echo "Downloading export templates for Godot $GODOT_VER"
          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_mono_export_templates.tpz"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VER}.mono"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q templates.tpz -d /tmp/templates_extract
          cp -r /tmp/templates_extract/templates/* "$TEMPLATES_DIR/"
          echo "Templates installed"
          ls "$TEMPLATES_DIR/"

      - name: Build C# solutions with Godot
        run: |
          cd recovered
          # godot --build-solutions 会调用 dotnet build 并生成 .godot/mono/ 目录
          godot --headless --build-solutions 2>&1 | tail -30 || true
          echo "=== .godot/mono/ ==="
          ls -la .godot/mono/ 2>/dev/null || echo "No .godot/mono/ generated"
          cd ..

      - name: Export Xcode project
        run: |
          cd recovered
          godot --headless --export-release "iOS" ../PlantsVsZombiesHybrid.xcodeproj 2>&1 | tail -30 || true
          cd ..
          ls PlantsVsZombiesHybrid.xcodeproj/ 2>/dev/null || ls | grep xcodeproj
          cat > detect_scheme.py << 'PYEOF'
          import re
          with open('PlantsVsZombiesHybrid.xcodeproj/project.pbxproj') as f:
              content = f.read()
          m = re.search(r'PBXNativeTarget.*?\{.*?name = ([^;]+);', content, re.DOTALL)
          if m:
              print(m.group(1).strip().strip('"'))
          else:
              print('PlantsVsZombiesHybrid')
          PYEOF
          SCHEME=$(python3 detect_scheme.py)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Detected scheme: $SCHEME"

      - name: Patch project.godot for iPad fullscreen (stretch=expand)
        run: |
          GODOT_FILE="recovered/project.godot"
          if [ -f "$GODOT_FILE" ]; then
            if grep -q '^\[display\]' "$GODOT_FILE" ]; then
              echo "[display] section exists"
            else
              echo "" >> "$GODOT_FILE"
              echo "[display]" >> "$GODOT_FILE"
            fi
            sed -i '' '/^window\/stretch\/mode/d' "$GODOT_FILE"
            sed -i '' '/^window\/stretch\/aspect/d' "$GODOT_FILE"
            sed -i '' '/^window\/stretch\/scale/d' "$GODOT_FILE"
            sed -i '' '/^window\/size\/viewport_width/d' "$GODOT_FILE"
            sed -i '' '/^window\/size\/viewport_height/d' "$GODOT_FILE"
            sed -i '' '/^window\/size\/window_width_override/d' "$GODOT_FILE"
            sed -i '' '/^window\/size\/window_height_override/d' "$GODOT_FILE"
            python3 - << 'PYEOF'
          import re
          path = "recovered/project.godot"
          with open(path) as f:
              content = f.read()
          for key in ["window/stretch/mode", "window/stretch/aspect", "window/stretch/scale",
                       "window/size/viewport_width", "window/size/viewport_height",
                       "window/size/window_width_override", "window/size/window_height_override"]:
              content = re.sub(rf'^{re.escape(key)}=.*\n?', '', content, flags=re.MULTILINE)
          if '[display]' not in content:
              content += '\n[display]\n'
          stretch = ('window/stretch/mode="canvas_items"\n'
                     'window/stretch/aspect="expand"\n'
                     'window/stretch/scale="1.0"\n'
                     'window/size/viewport_width=2388\n'
                     'window/size/viewport_height=1668\n'
                     'window/size/window_width_override=2388\n'
                     'window/size/window_height_override=1668\n')
          content = content.replace('[display]\n', '[display]\n' + stretch, 1)
          with open(path, 'w') as f:
              f.write(content)
          print("Patched [display] section")
          PYEOF
            echo "=== Patched [display] section ==="
            grep -A 10 '^\[display\]' "$GODOT_FILE" | head -15
          else
            echo "WARNING: project.godot not found at $GODOT_FILE"
            ls recovered/ | head -10
          fi

      - name: Fix signing conflict in project.pbxproj
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = "Manual";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = "Automatic";/CODE_SIGN_STYLE = "Manual";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = Apple[^;]*;/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = iPhone[^;]*;/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = "YES";/CODE_SIGNING_REQUIRED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = "YES";/CODE_SIGNING_ALLOWED = NO;/g' project.pbxproj
          echo "Fixed project.pbxproj signing settings"
          grep -E "CODE_SIGN" project.pbxproj | head -20

      - name: Fix missing framework links (Metal/QuartzCore/CoreAudio)
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          python3 ../.github/workflows/fix_frameworks.py || true
          echo "=== Verify frameworks in pbxproj ==="
          grep -c "Metal.framework" project.pbxproj || true
          grep -c "QuartzCore.framework" project.pbxproj || true
          grep -c "CoreAudio.framework" project.pbxproj || true

      - name: 保存阶段2产物（失败也保存）
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stage-xcodeproj
          path: PlantsVsZombiesHybrid.xcodeproj/
          retention-days: 7

      # ========== 阶段3：构建 IPA ==========
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          SCHEME="${SCHEME//\"}"
          SCHEME="${SCHEME:-${{ github.event.inputs.app_name }}}"
          echo "Building with scheme: $SCHEME"
          xcodebuild -project PlantsVsZombiesHybrid.xcodeproj -list 2>&1 | head -20

          xcodebuild -project PlantsVsZombiesHybrid.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -50
          XCODE_EXIT=${PIPESTATUS[0]}
          if [ "$XCODE_EXIT" -ne 0 ]; then
            echo "ERROR: xcodebuild failed with exit code $XCODE_EXIT"
            exit "$XCODE_EXIT"
          fi

          APP_DIR="build/Build/Products/Release-iphoneos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found in $APP_DIR"
            find build -name "*.app" 2>/dev/null || echo "No .app found at all"
            exit 1
          fi
          echo "APP found: $APP"
          ls -la "$APP" | head -5

          APP_BASENAME=$(basename "$APP")
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" "ipa/Payload/$APP_BASENAME"
          IPA_NAME="pvz-hybrid.ipa"
          (cd ipa && zip -qry "../$IPA_NAME" Payload)
          if [ ! -f "$IPA_NAME" ]; then
            echo "ERROR: IPA creation failed"
            exit 1
          fi
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          ls -la "$IPA_NAME"

      - name: 保存阶段3产物（失败也保存）
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stage-ipa
          path: pvz-hybrid.ipa
          retention-days: 7

      - name: Create Release and upload IPA
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          RELEASE_TAG="v${{ github.event.inputs.version }}"
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG exists, uploading IPA..."
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --title "${{ github.event.inputs.app_name }} $RELEASE_TAG" --notes "iOS build for $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "${{ env.IPA_NAME }}" --clobber
          echo "IPA uploaded to release $RELEASE_TAG"
