name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application name'
        required: false
        default: 'PlantsVsZombies Hybrid'
        type: string
      bundle_id:
        description: 'Bundle identifier'
        required: false
        default: 'com.plantsvszombies.hybrid'
        type: string
      version:
        description: 'Version number'
        required: false
        default: '0.25.5'
        type: string
      team_id:
        description: 'Apple Developer Team ID (10 chars, use AAAAAAAAAA for unsigned)'
        required: false
        default: 'AAAAAAAAAA'
        type: string
      force_recover:
        description: 'Force GDRE recovery (disable cache)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ========== 标准化 version 输入（去掉可能带的 v 前缀） ==========
      - name: Normalize version
        id: normver
        run: |
          VER="${{ github.event.inputs.version }}"
          VER="${VER#v}"
          echo "raw=$VER" >> "$GITHUB_OUTPUT"
          echo "Normalized version: $VER"

      # ========== 先获取 GDRE 最新版本（用于缓存 key，确保版本升级后强制重新 recover） ==========
      - name: 获取 GDRE 最新版本
        id: gdre-version-check
        run: |
          GDRE_VER=$(curl -s --max-time 10 https://api.github.com/repos/GDRETools/gdsdecomp/releases/latest | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['tag_name'])" 2>/dev/null || echo "")
          if [ -z "$GDRE_VER" ]; then
            # Fallback: rate limited or API unavailable - use known latest
            GDRE_VER="v2.6.3"
            echo "WARNING: GitHub API unavailable, using fallback GDRE version $GDRE_VER"
          fi
          echo "gdre_version=$GDRE_VER" >> "$GITHUB_OUTPUT"
          echo "GDRE latest: $GDRE_VER"

      # ========== 断点恢复：尝试拉取上次中间产物（force_recover=true 时跳过） ==========
      - name: 拉取阶段1-GDRE恢复产物
        if: ${{ !inputs.force_recover }}
        id: recover-stage
        uses: actions/cache/restore@v5
        with:
          path: recovered/
          # Bind recovery cache to this workflow commit so syntax-fixer changes
          # can never reuse a previously mutated recovered/ tree.
          key: gdre-recovery-v2-${{ runner.os }}-${{ steps.normver.outputs.raw }}-${{ steps.gdre-version-check.outputs.gdre_version }}-${{ github.sha }}

      # ========== 判断缓存是否真正生效（精确命中 或 restore-keys 拉到了 recovered/） ==========
      - name: 判断缓存是否有效
        id: cache-valid
        run: |
          CACHE_HIT="${{ steps.recover-stage.outputs.cache-hit }}"
          if [ "$CACHE_HIT" = "true" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Exact cache hit, good"
          elif [ -d recovered ] && [ -f "recovered/project.godot" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Cache restored via restore-keys (recovered/ exists)"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "No cache, need to download and recover"
          fi

      # ========== 阶段1：下载 + GDRE 恢复 ==========
      - name: Download ZIP from Release
        if: steps.cache-valid.outputs.valid != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ steps.normver.outputs.raw }}"
          gh release download "$RELEASE_TAG" --pattern "source.zip"
          ls -la source.zip

      - name: Install 7-Zip (Deflate64 support)
        if: steps.cache-valid.outputs.valid != 'true'
        run: |
          brew list p7zip &>/dev/null || brew install p7zip

      - name: Unzip project
        if: steps.cache-valid.outputs.valid != 'true'
        run: |
          7z x source.zip -oextracted -y
          ls extracted/

      - name: Setup Java 17
        if: steps.cache-valid.outputs.valid != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install GDRE
        id: gdre-install
        if: steps.cache-valid.outputs.valid != 'true'
        run: |
          GDRE_VERSION="${{ steps.gdre-version-check.outputs.gdre_version }}"
          echo "GDRE version: $GDRE_VERSION"
          curl -L -o gdre-macos.zip "https://github.com/GDRETools/gdsdecomp/releases/download/${GDRE_VERSION}/GDRE_tools-${GDRE_VERSION}-macos.zip"
          unzip -q gdre-macos.zip -d gdre_extracted
          GDRE_BIN="gdre_extracted/Godot RE Tools.app/Contents/MacOS/Godot RE Tools"
          chmod +x "$GDRE_BIN"
          echo "GDRE installed: $GDRE_BIN ($GDRE_VERSION)"
          "$GDRE_BIN" --help 2>&1 | head -5 || true

      - name: Find and recover PCK
        id: recover
        if: steps.cache-valid.outputs.valid != 'true'
        run: |
          PCK=$(find extracted -name "*.pck" | head -1)
          if [ -z "$PCK" ]; then
            echo "ERROR: No PCK file found"
            exit 1
          fi
          echo "Found PCK: $PCK"
          mkdir -p recovered
          GDRE_BIN="gdre_extracted/Godot RE Tools.app/Contents/MacOS/Godot RE Tools"
          "$GDRE_BIN" --recover="$PCK" --output=recovered/ 2>&1 | tail -20
          ls recovered/ | head -10

      # ========== 强制保存阶段1缓存（不管后面构建成不成） ==========
      - name: 强制保存阶段1缓存
        id: save-stage1
        if: steps.cache-valid.outputs.valid != 'true'
        uses: actions/cache/save@v5
        with:
          path: recovered/
          key: gdre-recovery-v2-${{ runner.os }}-${{ steps.normver.outputs.raw }}-${{ steps.gdre-version-check.outputs.gdre_version }}-${{ github.sha }}

      - name: 保存阶段1产物（失败也保存）
        if: always() && (steps.cache-valid.outputs.valid != 'true')
        uses: actions/upload-artifact@v6
        with:
          name: stage-recovered
          path: recovered/
          retention-days: 7

      # ========== 阶段2：探测版本 + 安装 Godot ==========
      - name: Detect Godot and .NET versions
        id: detect
        run: |
          set -euo pipefail
          CSPROJ_FILE=$(ls recovered/*.csproj 2>/dev/null | head -1)
          GLOBAL_JSON="recovered/global.json"

          # 优先从 global.json 读 .NET 版本
          DOTNET_VER=""
          if [ -f "$GLOBAL_JSON" ]; then
            DOTNET_VER=$(python3 -c 'import json; d=json.load(open("'"$GLOBAL_JSON"'")); v=d.get("sdk",{}).get("version",""); print(f"{v.split(chr(46))[0]}.{v.split(chr(46))[1]}") if v else print("")' 2>/dev/null || true)
          fi

          # 从 .csproj 读 Godot SDK 版本和 TargetFramework
          GODOT_SDK=""
          TF=""
          if [ -n "$CSPROJ_FILE" ]; then
            GODOT_SDK=$(python3 -c "import re; c=open('$CSPROJ_FILE').read(); m=re.search(r'Godot\\.NET\\.Sdk/([0-9]+\\.[0-9]+\\.[0-9]+)',c); print(m.group(1)) if m else (print(re.search(r'Godot\\.NET\\.Sdk/([0-9]+\\.[0-9]+)',c).group(1)) if re.search(r'Godot\\.NET\\.Sdk/([0-9]+\\.[0-9]+)',c) else print(''))")
            TF=$(python3 -c "import re; c=open('$CSPROJ_FILE').read(); m=re.search(r'<TargetFramework>net([0-9]+)',c); print('net'+m.group(1)) if m else print('')")
          fi

          # .NET 版本：global.json > csproj > 默认 8.0
          if [ -z "$DOTNET_VER" ] && [ -n "$TF" ]; then
            TF_NUM="${TF#net}"
            DOTNET_VER="${TF_NUM:0:1}.${TF_NUM:1}"
          fi
          DOTNET_VER="${DOTNET_VER:-8.0}"

          # Godot 版本：csproj > 默认 4.7.0
          GODOT_STABLE="${GODOT_SDK:-4.7.0}-stable"

          echo "godot_version=$GODOT_STABLE" >> $GITHUB_OUTPUT
          echo "dotnet_version=$DOTNET_VER" >> $GITHUB_OUTPUT
          echo "godot_cache_key=godot-${GODOT_STABLE}-${{ runner.os }}" >> $GITHUB_OUTPUT
          echo "Godot: $GODOT_STABLE, .NET: $DOTNET_VER"

      - name: Generate export_presets.cfg
        run: |
          python3 .github/workflows/generate_presets.py "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.bundle_id }}" "${{ github.event.inputs.version }}" "${{ github.event.inputs.team_id }}"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '${{ steps.detect.outputs.dotnet_version }}.x'

      - name: Install .NET iOS Workload
        run: |
          dotnet workload install ios
          echo ".NET iOS workload installed successfully."

      - name: Install Godot
        id: godot-cache
        uses: actions/cache/restore@v5
        with:
          path: /Users/runner/Godot.app
          key: ${{ steps.detect.outputs.godot_cache_key }}

      - name: Download and install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          GODOT_VER="${{ steps.detect.outputs.godot_version }}"
          # CDN 版本号去掉 .0（4.7.0-stable → 4.7-stable）
          GODOT_VER_CDN="${GODOT_VER%.0-stable}-stable"
          echo "Downloading Godot $GODOT_VER Mono (CDN: $GODOT_VER_CDN)"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER_CDN}/Godot_v${GODOT_VER_CDN}_mono_macos.universal.zip"
          unzip -q godot.zip -d godot_extracted
          mv godot_extracted/Godot_mono.app $HOME/Godot.app
          GODOT="$HOME/Godot.app/Contents/MacOS"
          echo "$GODOT" >> $GITHUB_PATH
          "$GODOT/Godot" --version

      - name: 强制保存 Godot 缓存
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /Users/runner/Godot.app
          key: ${{ steps.detect.outputs.godot_cache_key }}

      - name: 确保 Godot 在 PATH 中
        if: steps.godot-cache.outputs.cache-hit == 'true'
        run: |
          GODOT="$HOME/Godot.app/Contents/MacOS"
          if [ -d "$GODOT" ]; then
            echo "$GODOT" >> $GITHUB_PATH
            "$GODOT/Godot" --version
            echo "Godot restored from cache and added to PATH"
          else
            echo "ERROR: Godot.app not found at $HOME/Godot.app despite cache hit"
            ls -la $HOME/ | head -10
            exit 1
          fi

      - name: Install iOS export templates
        run: |
          set -euo pipefail
          GODOT_VER="${{ steps.detect.outputs.godot_version }}"
          echo "Downloading export templates for Godot $GODOT_VER"
          GODOT_VER_CDN="${GODOT_VER%.0-stable}-stable"
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER_CDN}/Godot_v${GODOT_VER_CDN}_mono_export_templates.tpz"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VER/-/.}.mono"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q templates.tpz -d /tmp/templates_extract
          cp -r /tmp/templates_extract/templates/* "$TEMPLATES_DIR/"
          echo "Templates installed"
          ls "$TEMPLATES_DIR/"

      # ========== Godot Mono 构建流程：直接 dotnet build（跳过 godot --build-solutions，插件在 headless 下报错） ==========
      - name: Remove test code and editor-only addons (GDRE artifacts)
        run: |
          set -euo pipefail
          cd recovered
          # Test/ is the actual GDRE-recovered test directory (Note: NOT Tests/)
          echo "=== Removing Test/ and Tests/ ==="
          rm -rf Test/ Tests/
          # ModEditor: provides editor UI types (XWGenericVisualResourceEditor etc.)
          # used ONLY in Test/ files which are already deleted above.
          # AdobeAnimateEditor: provides runtime C# types (AdobeAnimateSprite/Part/Slot/Data etc.)
          # used by core game scripts -- DO NOT delete.
          echo "=== Removing ModEditor addon only ==="
          rm -rf addons/ModEditor/
          # XWAdobeAnimateImportService.cs references PVZHE.ModEditor.FileSystem (from deleted ModEditor)
          # It's an editor import tool, not runtime code — safe to remove.
          rm -f addons/AdobeAnimateEditor/Tools/XWAdobeAnimateImportService.cs
          echo "=== Cleaning up broken plugin/autoload refs from project.godot ==="
          python3 ../.github/workflows/clean_project_godot.py project.godot
          echo "=== Remaining addons ==="
          ls -d addons/*/ 2>/dev/null || echo "No addons"
          echo "=== Size ==="
          du -sh . | cut -f1
          cd ..

      - name: Fix GDRE decompiled C# syntax issues
        run: |
          set -euo pipefail
          cd recovered
          python3 ../.github/workflows/fix_gdre_syntax.py . --verbose
          cd ..

      - name: Build C# with dotnet
        id: dotnet-build
        run: |
          set -euo pipefail
          cd recovered
          CSPROJ=$(ls *.csproj | head -1)
          echo "Building $CSPROJ with dotnet..."
          # Keep GDRE output unchanged here. CS0165 is a compiler diagnostic that
          # requires source/control-flow correction; heuristic bulk rewrites are unsafe.
          dotnet restore "$CSPROJ" 2>&1 | tee dotnet-restore.log
          dotnet build "$CSPROJ" -c Release 2>&1 | tee dotnet-build.log
          echo "=== Build output ==="
          ls -la bin/Release/*/ 2>/dev/null || echo "No bin/Release output"
          cd ..
      - name: 保存 C# 编译诊断（失败也保存）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: csharp-build-diagnostics
          path: |
            recovered/dotnet-restore.log
            recovered/dotnet-build.log
            recovered/PlantsVsZombies.csproj
            recovered/project.godot
          if-no-files-found: warn
          retention-days: 7

      - name: Patch project.godot for iPad fullscreen (stretch=expand)
        run: |
          # Must run BEFORE export so settings are baked into xcodeproj
          GODOT_FILE="recovered/project.godot"
          if [ ! -f "$GODOT_FILE" ]; then
            echo "WARNING: project.godot not found at $GODOT_FILE"
            ls recovered/ | head -10
            exit 0
          fi
          if ! grep -q '^\[display\]' "$GODOT_FILE"; then
            echo "" >> "$GODOT_FILE"
            echo "[display]" >> "$GODOT_FILE"
          fi
          sed -i '' '/^window\/stretch\/mode/d' "$GODOT_FILE"
          sed -i '' '/^window\/stretch\/aspect/d' "$GODOT_FILE"
          sed -i '' '/^window\/stretch\/scale/d' "$GODOT_FILE"
          sed -i '' '/^window\/size\/viewport_width/d' "$GODOT_FILE"
          sed -i '' '/^window\/size\/viewport_height/d' "$GODOT_FILE"
          sed -i '' '/^window\/size\/window_width_override/d' "$GODOT_FILE"
          sed -i '' '/^window\/size\/window_height_override/d' "$GODOT_FILE"
          python3 .github/workflows/patch_godot_display.py
          echo "=== Patched [display] section ==="
          grep -A 10 '^\[display\]' "$GODOT_FILE" | head -15

      - name: Export Xcode project
        run: |
          set -euo pipefail
          cd recovered
          # Temporarily disable errexit+pipefail so godot's exit code
          # can be captured via PIPESTATUS even when godot fails.
          set +e
          set +o pipefail
          godot --headless --export-release "iOS" ../PlantsVsZombiesHybrid.xcodeproj 2>&1 | tail -30
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          set -o pipefail
          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "ERROR: Godot export failed with exit code $GODOT_EXIT"
            ls -la ../
            exit "$GODOT_EXIT"
          fi
          cd ..
          ls PlantsVsZombiesHybrid.xcodeproj/ 2>/dev/null || ls | grep xcodeproj
          SCHEME=$(python3 .github/workflows/detect_scheme.py)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Detected scheme: $SCHEME"

      - name: Fix signing conflict in project.pbxproj
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = "Manual";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = "Automatic";/CODE_SIGN_STYLE = "Manual";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = Apple[^;]*;/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = iPhone[^;]*;/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = "YES";/CODE_SIGNING_REQUIRED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = "YES";/CODE_SIGNING_ALLOWED = NO;/g' project.pbxproj
          echo "Fixed project.pbxproj signing settings"
          grep -E "CODE_SIGN" project.pbxproj | head -20

      - name: Fix missing framework links (Metal/QuartzCore/CoreAudio)
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          python3 ../.github/workflows/fix_frameworks.py || true
          echo "=== Verify frameworks in pbxproj ==="
          grep -c "Metal.framework" project.pbxproj || true
          grep -c "QuartzCore.framework" project.pbxproj || true
          grep -c "CoreAudio.framework" project.pbxproj || true

      - name: 保存阶段2产物（失败也保存）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage-xcodeproj
          path: PlantsVsZombiesHybrid.xcodeproj/
          retention-days: 7

      # ========== 阶段3：构建 IPA + 完整性验证 ==========
      - name: Build unsigned IPA
        id: build-ipa
        run: |
          set -euo pipefail
          SCHEME="${SCHEME//\"}"
          SCHEME="${SCHEME:-${{ github.event.inputs.app_name }}}"
          echo "Building with scheme: $SCHEME"
          xcodebuild -project PlantsVsZombiesHybrid.xcodeproj -list 2>&1 | head -20

          set +e
          set +o pipefail
          xcodebuild -project PlantsVsZombiesHybrid.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -50
          XCODE_EXIT=${PIPESTATUS[0]}
          set -e
          set -o pipefail
          if [ "$XCODE_EXIT" -ne 0 ]; then
            echo "ERROR: xcodebuild failed with exit code $XCODE_EXIT"
            exit "$XCODE_EXIT"
          fi

          APP_DIR="build/Build/Products/Release-iphoneos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found in $APP_DIR"
            find build -name "*.app" 2>/dev/null || echo "No .app found at all"
            exit 1
          fi
          echo "APP found: $APP"
          ls -la "$APP" | head -5

          # ========== 完整性验证：检查 C# 运行时 ==========
          echo "=== Integrity check: C# runtime ==="
          HAS_FRAMEWORKS=false
          HAS_DLL=false
          HAS_AOTDATA=false
          HAS_GODOTSHARP=false

          if [ -d "$APP/Frameworks" ]; then
            HAS_FRAMEWORKS=true
            echo "  [PASS] Frameworks/ exists"
            ls "$APP/Frameworks/"
          else
            echo "  [FAIL] No Frameworks/ directory"
          fi

          DLL_COUNT=$(find "$APP" -name "*.dll" 2>/dev/null | wc -l)
          if [ "$DLL_COUNT" -gt 0 ]; then
            HAS_DLL=true
            echo "  [PASS] Found $DLL_COUNT .dll files"
            find "$APP" -name "*.dll" | head -5
          else
            echo "  [FAIL] No .dll files found"
          fi

          AOT_COUNT=$(find "$APP" -name "*.aotdata" 2>/dev/null | wc -l)
          if [ "$AOT_COUNT" -gt 0 ]; then
            HAS_AOTDATA=true
            echo "  [PASS] Found $AOT_COUNT .aotdata files"
          else
            echo "  [WARN] No .aotdata files (may be OK for non-AOT builds)"
          fi

          GS_COUNT=$(find "$APP" -name "*GodotSharp*" 2>/dev/null | wc -l)
          if [ "$GS_COUNT" -gt 0 ]; then
            HAS_GODOTSHARP=true
            echo "  [PASS] Found GodotSharp references"
          else
            echo "  [FAIL] No GodotSharp found"
          fi

          # 关键检查：必须有 Frameworks 或 .dll（Godot Mono 导出必须二者之一）
          if [ "$HAS_FRAMEWORKS" = false ] && [ "$HAS_DLL" = false ]; then
            echo ""
            echo "============================================"
            echo "INTEGRITY CHECK FAILED: No C# runtime found!"
            echo "Neither Frameworks/ nor .dll files exist."
            echo "This IPA will crash on launch."
            echo "============================================"
            exit 1
          fi
          echo ""
          echo "=== Integrity check PASSED ==="

          APP_BASENAME=$(basename "$APP")
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" "ipa/Payload/$APP_BASENAME"
          IPA_NAME="pvz-hybrid-v${{ steps.normver.outputs.raw }}.ipa"
          (cd ipa && zip -qry "../$IPA_NAME" Payload)
          if [ ! -f "$IPA_NAME" ]; then
            echo "ERROR: IPA creation failed"
            exit 1
          fi
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          ls -la "$IPA_NAME"

      - name: 保存阶段3产物（失败也保存）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage-ipa
          path: pvz-hybrid-v*.ipa
          retention-days: 7

      - name: Create Release and upload IPA
        if: steps.build-ipa.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          RELEASE_TAG="v${{ steps.normver.outputs.raw }}"
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG exists, uploading IPA..."
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --title "${{ github.event.inputs.app_name }} $RELEASE_TAG" --notes "iOS build for $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "${{ env.IPA_NAME }}" --clobber
          echo "IPA uploaded to release $RELEASE_TAG"
