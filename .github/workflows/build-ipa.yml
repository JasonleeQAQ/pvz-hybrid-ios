name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application name'
        required: false
        default: 'PlantsVsZombies Hybrid'
        type: string
      bundle_id:
        description: 'Bundle identifier'
        required: false
        default: 'com.plantsvszombies.hybrid'
        type: string
      version:
        description: 'Version number'
        required: false
        default: '0.25.5'
        type: string
      team_id:
        description: 'Apple Developer Team ID (10 chars, use AAAAAAAAAA for unsigned)'
        required: false
        default: 'AAAAAAAAAA'
        type: string

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download ZIP from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.event.inputs.version }}"
          gh release download "$RELEASE_TAG" --pattern "source.zip"
          ls -la source.zip

      - name: Install 7-Zip (Deflate64 support)
        run: |
          brew install p7zip

      - name: Unzip project
        run: |
          7z x source.zip -oextracted -y
          ls extracted/

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install GDRE
        run: |
          curl -L -o gdre-macos.zip "https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.0/GDRE_tools-v2.6.0-macos.zip"
          unzip -q gdre-macos.zip -d gdre_extracted
          GDRE_BIN="gdre_extracted/Godot RE Tools.app/Contents/MacOS/Godot RE Tools"
          chmod +x "$GDRE_BIN"
          echo "GDRE installed: $GDRE_BIN"
          "$GDRE_BIN" --help 2>&1 | head -5 || true

      - name: Find and recover PCK
        id: recover
        run: |
          PCK=$(find extracted -name "*.pck" | head -1)
          if [ -z "$PCK" ]; then
            echo "ERROR: No PCK file found"
            exit 1
          fi
          echo "Found PCK: $PCK"
          mkdir -p recovered
          GDRE_BIN="gdre_extracted/Godot RE Tools.app/Contents/MacOS/Godot RE Tools"
          "$GDRE_BIN" --recover="$PCK" --output=recovered/ 2>&1 | tail -20
          ls recovered/ | head -10

      - name: Generate export_presets.cfg
        run: |
          cat > generate_presets.py << 'GENEOF'
          import sys
          app_name = sys.argv[1]
          bundle_id = sys.argv[2]
          version = sys.argv[3]
          team_id = sys.argv[4]
          short_version = version

          lines = [
              "[preset.0]",
              'name="iOS"',
              'platform="iOS"',
              "runnable=true",
              "advanced_options=false",
              "dedicated_server=false",
              'custom_features=""',
              'export_filter="all_resources"',
              'include_filter=""',
              'exclude_filter=""',
              'export_path="../PlantsVsZombiesHybrid.xcodeproj"',
              'encryption_include_filters=""',
              'encryption_exclude_filters=""',
              "encrypt_pck=false",
              "encrypt_directory=false",
              "",
              "[preset.0.options]",
              'custom_template/debug=""',
              'custom_template/release=""',
              f'application/app_store_team_id="{team_id}"',
              'application/provisioning_profile_uuid_debug=""',
              'application/provisioning_profile_uuid_release=""',
              f'application/name="{app_name}"',
              'application/info="Made with Godot Engine"',
              'application/signature=""',
              f'application/version="{version}.0"',
              f'application/bundle_identifier="{bundle_id}"',
              "application/categories=PackedStringArray()",
              f'application/short_version="{short_version}"',
              'application/min_ios_version="16.0"',
              "application/orientation/portrait=false",
              "application/orientation/landscape_left=true",
              "application/orientation/landscape_right=true",
              "application/orientation/portrait_upside_down=false",
              'application/interruption_policy="stop"',
              "application/supports_opengl=false",
              "application/supports_metal=true",
              "application/supports_open_gles2=false",
              "application/supports_open_gles3=true",
              "application/supports_vulkan=false",
              'application/icon="res://icon.png"',
              'application/additional_plist_content=""',
              "capabilities/access_wifi=false",
              "capabilities/push_notifications=false",
              "capabilities/performance_gaming=false",
              "capabilities/performance_a12=false",
              "user_data/accessible_files_directories=PackedStringArray()",
              'architecture/target="arm64"',
              "application/export_method_debug=0",
              "application/export_method_release=0",
              'application/code_sign_identity_debug=""',
              'application/code_sign_identity_release=""',
          ]
          with open("recovered/export_presets.cfg", "w") as f:
              f.write("\n".join(lines) + "\n")
          print("export_presets.cfg generated")
          GENEOF
          python3 generate_presets.py "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.bundle_id }}" "${{ github.event.inputs.version }}" "${{ github.event.inputs.team_id }}"

      - name: Install Godot 4.7.1 .NET
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_macos.universal.zip"
          unzip -q godot.zip -d godot_extracted
          mv godot_extracted/Godot_mono.app $HOME/Godot.app
          GODOT="$HOME/Godot.app/Contents/MacOS"
          echo "$GODOT" >> $GITHUB_PATH
          "$GODOT/Godot" --version

      - name: Install iOS export templates
        run: |
          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.1.stable.mono"
          mkdir -p "$TEMPLATES_DIR"
          # .tpz is a zip with templates/ subdirectory
          unzip -q templates.tpz -d /tmp/templates_extract
          # Move contents from templates/ to the versioned directory
          cp -r /tmp/templates_extract/templates/* "$TEMPLATES_DIR/"
          echo "Templates installed"
          ls "$TEMPLATES_DIR/"

      - name: Export Xcode project
        run: |
          cd recovered
          godot --headless --export-release "iOS" ../PlantsVsZombiesHybrid.xcodeproj 2>&1 | tail -30
          ls ../PlantsVsZombiesHybrid.xcodeproj/ 2>/dev/null || ls ../ | grep xcodeproj
          # Detect scheme from pbxproj (default scheme = project name)
          SCHEME=$(python3 -c "
          import re
          with open('../PlantsVsZombiesHybrid.xcodeproj/project.pbxproj') as f:
              content = f.read()
          # Try to get target name from PBXNativeTarget section
          m = re.search(r'PBXNativeTarget.*?\{.*?name = ([^;]+);', content, re.DOTALL)
          if m:
              print(m.group(1).strip())
          else:
              print('PlantsVsZombiesHybrid')
          ")
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Detected scheme: $SCHEME"

      - name: Patch project.godot for iPad fullscreen (stretch=expand)
        run: |
          # Insert stretch settings into project.godot to eliminate black bars on 4:3 iPad
          # Uses 'expand' aspect (ignore removed in 4.7) — viewport matches screen aspect, no letterbox
          GODOT_FILE="recovered/project.godot"
          if [ -f "$GODOT_FILE" ]; then
            if grep -q '^\[display\]' "$GODOT_FILE"; then
              echo "[display] section exists"
            else
              echo "" >> "$GODOT_FILE"
              echo "[display]" >> "$GODOT_FILE"
            fi
            # Remove any existing stretch settings to avoid duplicates
            sed -i '' '/^window\/stretch\/mode/d' "$GODOT_FILE"
            sed -i '' '/^window\/stretch\/aspect/d' "$GODOT_FILE"
            sed -i '' '/^window\/stretch\/scale/d' "$GODOT_FILE"
            sed -i '' '/^window\/size\/viewport_width/d' "$GODOT_FILE"
            sed -i '' '/^window\/size\/viewport_height/d' "$GODOT_FILE"
            sed -i '' '/^window\/size\/window_width_override/d' "$GODOT_FILE"
            sed -i '' '/^window\/size\/window_height_override/d' "$GODOT_FILE"
            # Insert stretch config right after [display] line
            sed -i '' '/^\[display\]/a\
window/stretch/mode="canvas_items"\
window/stretch/aspect="expand"\
window/stretch/scale="1.0"\
window/size/viewport_width=2388\
window/size/viewport_height=1668\
window/size/window_width_override=2388\
window/size/window_height_override=1668' "$GODOT_FILE"
            echo "=== Patched [display] section ==="
            grep -A 10 '^\[display\]' "$GODOT_FILE" | head -15
          else
            echo "WARNING: project.godot not found at $GODOT_FILE"
            ls recovered/ | head -10
          fi

      - name: Fix signing conflict in project.pbxproj
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' project.pbxproj
          sed -i '' '/CODE_SIGN_IDENTITY = "Apple Distribution"/d' project.pbxproj
          sed -i '' '/CODE_SIGN_IDENTITY = "iPhone Distribution"/d' project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' project.pbxproj
          if ! grep -q 'CODE_SIGN_IDENTITY = ""' project.pbxproj; then
            sed -i '' '/CODE_SIGNING_ALLOWED = NO/a\				CODE_SIGN_IDENTITY = "";\
' project.pbxproj
          fi
          echo "=== Fixed signing settings ==="
          grep -E "CODE_SIGN" project.pbxproj | head -20

      - name: Fix signing conflict in project.pbxproj
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          # Replace automatic signing with manual and remove conflicting CODE_SIGN_IDENTITY
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' project.pbxproj
          sed -i '' '/CODE_SIGN_IDENTITY = "Apple Distribution"/d' project.pbxproj
          sed -i '' '/CODE_SIGN_IDENTITY = "iPhone Distribution"/d' project.pbxproj
          # Add CODE_SIGNING_ALLOWED=NO to all build configurations
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' project.pbxproj
          # Add CODE_SIGN_IDENTITY="" if not present
          if ! grep -q 'CODE_SIGN_IDENTITY = ""' project.pbxproj; then
            sed -i '' '/CODE_SIGNING_ALLOWED = NO/a\t			CODE_SIGN_IDENTITY = "";""' project.pbxproj
          fi
          echo "Fixed project.pbxproj signing settings"
          grep -E "CODE_SIGN|PROVISIONING" project.pbxproj | head -20

      - name: Build unsigned IPA
        run: |
          cd PlantsVsZombiesHybrid.xcodeproj
          SCHEME="${SCHEME:-${{ github.event.inputs.app_name }}}"
          echo "Building with scheme: $SCHEME"
          xcodebuild -project PlantsVsZombiesHybrid.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
          # Find the built .app
          APP_DIR="../build/Build/Products/Release-iphoneos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found in $APP_DIR"
            find ../build -name "*.app" 2>/dev/null || echo "No .app found at all"
            exit 1
          fi
          echo "APP found: $APP"
          ls -la "$APP" | head -5
          cd ..
          # Package IPA (Payload/*.app → zip)
          APP_BASENAME=$(basename "$APP")
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" "ipa/Payload/$APP_BASENAME"
          IPA_NAME="pvz-hybrid.ipa"
          (cd ipa && zip -qry "../$IPA_NAME" Payload)
          if [ ! -f "$IPA_NAME" ]; then
            echo "ERROR: IPA creation failed"
            exit 1
          fi
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          ls -la "$IPA_NAME"

      - name: Create Release and upload IPA
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          RELEASE_TAG="v${{ github.event.inputs.version }}"
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG exists, uploading IPA..."
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --title "${{ github.event.inputs.app_name }} $RELEASE_TAG" --notes "iOS build for $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "${{ env.IPA_NAME }}" --clobber
          echo "IPA uploaded to release $RELEASE_TAG"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: pvz-hybrid-ipa
          path: pvz-hybrid.ipa
